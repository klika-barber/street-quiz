<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Street Quiz Pro</title>
<meta name="description" content="Street Quiz Pro — quizy uliczne, sondy i nagrody dla barber shopu. Działa offline.">
<meta name="theme-color" content="#0d0b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Street Quiz">
<link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"><link rel="manifest" href="manifest.webmanifest"><style>/* Street Quiz Pro — grafit + akcent marki. Layout: jedna kolumna na telefon (max 760px), dolna nawigacja,
   gra i wyniki w pełnoekranowej scenie. Desktop: panel admina w szerszej siatce. */
:root{
  --bg:#f3f1f5; --surface:#ffffff; --surface-2:#ebe7ef; --line:rgba(26,18,34,.12);
  --fg:#140f19; --fg-2:#4b4352; --muted:#7a7181;
  --accent:#c2418f; --accent-2:#6e55a8; --on-accent:#ffffff;
  --ok:#11804a; --ok-bg:#dcf3e6; --bad:#c42539; --bad-bg:#fbe0e4; --warn:#9a6200; --warn-bg:#fff0cc;
  --shadow:0 10px 30px rgba(30,15,40,.10);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0b10; --surface:#17141c; --surface-2:#221d29; --line:rgba(244,236,248,.12);
  --fg:#f6f1f8; --fg-2:#cfc6d6; --muted:#9a90a3;
  --accent:#ee8fca; --accent-2:#a08ad0; --on-accent:#16091a;
  --ok:#7fe0a8; --ok-bg:rgba(127,224,168,.14); --bad:#ff8496; --bad-bg:rgba(255,132,150,.14); --warn:#ffd27a; --warn-bg:rgba(255,210,122,.12);
  --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d0b10; --surface:#17141c; --surface-2:#221d29; --line:rgba(244,236,248,.12);
  --fg:#f6f1f8; --fg-2:#cfc6d6; --muted:#9a90a3;
  --accent:#ee8fca; --accent-2:#a08ad0; --on-accent:#16091a;
  --ok:#7fe0a8; --ok-bg:rgba(127,224,168,.14); --bad:#ff8496; --bad-bg:rgba(255,132,150,.14); --warn:#ffd27a; --warn-bg:rgba(255,210,122,.12);
  --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.reduce *{animation:none!important;transition:none!important}

.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brandmark img{height:34px;width:auto;max-width:120px;object-fit:contain}
.logo-bg{background:#16121a;border-radius:10px;padding:4px 8px}
.brandmark .tx{min-width:0}
.brandmark b{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark span{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on{background:var(--fg);color:var(--bg)}

h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,11vw,64px);line-height:.92;text-transform:uppercase;letter-spacing:.005em}
.h2{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase}
.h3{font-size:17px;font-weight:800}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.sec p{margin:0;font-size:13px;color:var(--muted)}
.stack{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spacer{flex:1}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* przyciski */
.btn{min-height:54px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s ease,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(105deg,var(--accent),var(--accent-2));color:var(--on-accent);border:0}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:40px;border-radius:12px;font-size:13px;padding:0 12px}
.btn.xl{min-height:72px;font-size:20px;border-radius:22px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:20px;height:20px}
.full{width:100%}

/* karty */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--fg-2);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--fg-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* start */
.hero{margin-top:10px;border-radius:26px;padding:22px;background:
  radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 60%),
  radial-gradient(100% 90% at 0% 100%,color-mix(in srgb,var(--accent-2) 22%,transparent),transparent 60%),var(--surface);border:1px solid var(--line)}
.hero p{margin:10px 0 18px;color:var(--fg-2);max-width:44ch}
.quick{display:grid;gap:10px}
.qcard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-height:78px}
.qcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);flex:0 0 auto}
.qcard .ic svg{width:24px;height:24px}
.qcard b{display:block;font-size:17px}
.qcard span{display:block;font-size:13px;color:var(--muted)}
.qcard .go{margin-left:auto;color:var(--muted);font-size:22px}
.resume{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-weight:700;margin-top:12px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:118px;display:flex;flex-direction:column;gap:6px}
.mode .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2)}
.mode .ic svg{width:21px;height:21px}
.mode b{font-size:15px;line-height:1.2}
.mode span{font-size:12px;color:var(--muted);line-height:1.35}
@media(min-width:620px){.modes{grid-template-columns:repeat(3,1fr)}}

/* nawigacja */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.nav .in{max-width:740px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:5px;box-shadow:var(--shadow)}
.nb{border:0;background:transparent;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.nb svg{width:22px;height:22px}
.nb.on{background:var(--surface-2);color:var(--fg)}

/* formularze */
label.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--fg-2)}
.inp,select.inp,textarea.inp{width:100%;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
textarea.inp{min-height:110px;resize:vertical}
.inp:focus{border-color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.switch:last-child{border-bottom:0}
.switch input{width:46px;height:28px;appearance:none;border-radius:99px;background:var(--surface-2);position:relative;border:1px solid var(--line);flex:0 0 auto;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:21px;background:var(--on-accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:12px;border:2px solid var(--line)}
.sw.on{border-color:var(--fg)}

/* listy */
.list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.li .t span{display:block;font-size:12.5px;color:var(--muted)}
.li .v{font-family:var(--f-mono);font-weight:700;font-size:15px}
.rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--surface-2)}
.rank.r1{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent)}
.empty{border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

/* statystyki */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:10px;font-size:13px}
.bar .tr{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar .fl{height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bar .vl{font-family:var(--f-mono);text-align:right;color:var(--fg-2)}
.cols{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px;border-bottom:1px solid var(--line)}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative}
.cols .c i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols .c em{font-style:normal;font-size:11px;font-family:var(--f-mono);color:var(--fg-2)}
.cols-l{display:flex;gap:6px}.cols-l span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);padding-top:4px}

/* SCENA GRY */
.stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.stage[hidden]{display:none!important}
.stage .in{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}
.ghead{display:flex;align-items:center;gap:8px}
.ghead .title{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.hud b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.hud span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hud .pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18);color:var(--ok)}}
.progress{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s ease}
.timer{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--fg);transition:width .1s linear}
.timer.low i{background:var(--bad)}
.qbox{display:flex;flex-direction:column;gap:10px;flex:1;justify-content:center;min-height:160px}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.qtext{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,8.4vw,52px);line-height:1;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.qtext.long{font-size:clamp(26px,6.6vw,40px)}
.qimg{display:grid;place-items:center}
.qimg img{max-height:34vh;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.qimg .emoji{font-size:110px;line-height:1}
.answers{display:grid;gap:10px}
.ans{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:64px;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px;font-weight:700;font-size:17px;transition:transform .1s,background .2s,border-color .2s}
.ans:active{transform:scale(.985)}
.ans .k{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-family:var(--f-mono);font-weight:700;font-size:15px}
.ans .hint{position:absolute;right:10px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.55}
.ans.good{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)} .ans.good .k{background:var(--ok);color:var(--surface)}
.ans.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .4s} .ans.bad .k{background:var(--bad);color:var(--surface)}
.ans.dim{opacity:.35}
.ans.gone{visibility:hidden}
.ans.sel{border-color:var(--fg)}
.ans .pct{margin-left:auto;font-family:var(--f-mono);font-size:14px}
.ans .aud{position:absolute;left:0;bottom:0;height:4px;background:var(--accent-2);border-radius:0 4px 0 18px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.answers.flags{grid-template-columns:1fr 1fr}
.answers.flags .ans{justify-content:center;padding:10px;min-height:110px}
.answers.flags .ans img{height:80px;border-radius:6px;border:1px solid var(--line)}
.answers.tf{grid-template-columns:1fr 1fr}
.answers.tf .ans{justify-content:center;min-height:96px;font-family:var(--f-display);font-size:30px;text-transform:uppercase}
.expl{border-radius:14px;padding:12px 14px;background:var(--surface-2);font-size:15px;color:var(--fg-2)}
.hostbar{display:flex;gap:6px;flex-wrap:wrap}
.hostbar .btn{flex:1;min-width:0}
.float{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-family:var(--f-display);font-weight:900;font-size:64px;color:var(--ok);pointer-events:none;z-index:90;animation:fl 1s ease forwards}
@keyframes fl{to{transform:translate(-50%,-90px);opacity:0}}
.lifelines{display:flex;gap:8px}
.ll{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ll small{font-weight:600;font-size:10px;color:var(--muted)}
.ll[disabled]{opacity:.3;text-decoration:line-through}
.ladder{display:grid;gap:3px}
.ladder div{display:flex;justify-content:space-between;padding:5px 10px;border-radius:9px;font-size:13px;font-family:var(--f-mono)}
.ladder .cur{background:linear-gradient(105deg,var(--accent),var(--accent-2));color:var(--on-accent);font-weight:700}
.ladder .done{color:var(--muted)}
.ladder .safe{font-weight:800}
.notice{border-radius:14px;padding:12px 14px;background:var(--warn-bg);color:var(--fg);font-size:14px}
.notice b{color:var(--warn)}

/* wynik */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;flex:1}
.result .big{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,13vw,110px);line-height:.9;max-width:100%;overflow-wrap:anywhere;text-wrap:balance;text-transform:uppercase}
.result .big.win{background:linear-gradient(105deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:win 1s ease}
@keyframes win{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}}
.result .score{font-family:var(--f-mono);font-size:44px;font-weight:700}
.prizebox{border-radius:20px;padding:16px;border:2px dashed var(--accent);width:100%}
.conf{position:fixed;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:95;animation:conf 1.2s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* arkusz */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(10,6,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet-bg[hidden]{display:none!important}
.sheet{width:min(100%,640px);max-height:88vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h3{flex:1;font-size:19px}
@media(min-width:700px){.sheet-bg{align-items:center}}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:999px;font-size:14px;font-weight:800;z-index:120;transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* koło */
.wheel-wrap{position:relative;width:min(86vw,420px);aspect-ratio:1;margin:0 auto;max-width:100%}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:28px solid var(--fg);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}

/* pary, chronologia */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .col{display:grid;gap:8px;align-content:start}
.pairs .ans{min-height:56px;font-size:15px;justify-content:center;text-align:center}
.vs2{display:grid;gap:10px}
.vs2 .ans{min-height:96px;font-size:20px;justify-content:center;text-align:center}
.year{font-family:var(--f-mono);font-size:14px;margin-left:8px;color:var(--fg-2)}
.photo{position:relative;overflow:hidden;border-radius:18px;background:var(--surface-2);aspect-ratio:4/5;max-height:46vh;margin:0 auto;width:min(100%,380px)}
.photo img{width:100%;height:100%;object-fit:cover;transition:filter .5s,transform .6s}
.voucher{border-radius:20px;padding:18px;background:var(--surface);border:2px dashed var(--accent);display:grid;gap:10px;justify-items:center;text-align:center}
.voucher .code{font-family:var(--f-mono);font-size:24px;font-weight:700;letter-spacing:.06em}
.qr{background:#fff;padding:10px;border-radius:12px;line-height:0}
.qr svg{width:170px;height:170px}
.board-img{width:min(100%,320px);border-radius:16px;box-shadow:var(--shadow);margin:0 auto;display:block}
.prompt{position:fixed;inset:0;z-index:100;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.prompt[hidden]{display:none!important}
.prompt .pq{font-family:var(--f-display);font-weight:900;text-transform:uppercase;font-size:clamp(44px,12vw,110px);line-height:.95;margin:auto 0;overflow-wrap:anywhere;text-wrap:balance}
.prompt .btn{background:var(--bg);color:var(--fg)}
.feature{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.feature:last-child{border-bottom:0}
@media print{
  .nav,.topbar,.no-print,.sheet-bg,.stage{display:none!important}
  body{background:#fff;color:#000}
  .card,.li{border-color:#ccc}
}
.li .go{margin-left:auto;color:var(--muted);font-size:22px;flex:0 0 auto}
.li svg{width:22px;height:22px}
.li .iconbtn{width:38px;height:38px}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

        // overwrite cellSize and margin.

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';

/* ---------- pamięć: IndexedDB z zapasem w localStorage ---------- */
const DB = App.DB = (() => {
  let db = null; const mem = {};
  const open = () => new Promise((res) => {
    try {
      const r = indexedDB.open("street-quiz-pro", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    } catch (e) { res(); }
  });
  const get = (k) => new Promise((res) => {
    if (!db) { try { const v = localStorage.getItem("sqp_" + k); return res(v == null ? mem[k] : JSON.parse(v)); } catch (e) { return res(mem[k]); } }
    try { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(mem[k]); } catch (e) { res(mem[k]); }
  });
  const set = (k, v) => new Promise((res) => {
    mem[k] = v;
    if (!db) { try { localStorage.setItem("sqp_" + k, JSON.stringify(v)); } catch (e) {} return res(); }
    try { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); }
  });
  const clear = () => new Promise((res) => { try { db.transaction("kv", "readwrite").objectStore("kv").clear().onsuccess = () => res(); } catch (e) { try { Object.keys(localStorage).filter((k) => k.startsWith("sqp_")).forEach((k) => localStorage.removeItem(k)); } catch (e2) {} res(); } });
  return { open, get, set, clear };
})();

/* ---------- dźwięk (Web Audio, bez plików) ---------- */
const Snd = App.Snd = (() => {
  let ac = null, master = null;
  const ctx = () => { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; try { ac = new A(); master = ac.createGain(); master.gain.value = 0.22; master.connect(ac.destination); } catch (e) { return null; } } if (ac.state === "suspended") { try { ac.resume(); } catch (e) {} } return ac; };
  const tone = (f, d, type, g, w) => { if (!S.settings.sounds || !ctx()) return; const t = ac.currentTime + (w || 0), o = ac.createOscillator(), v = ac.createGain(); o.type = type || "sine"; o.frequency.value = f; v.gain.setValueAtTime(g || 0.08, t); v.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(v); v.connect(master); o.start(t); o.stop(t + d + 0.02); };
  return {
    unlock: ctx,
    tap: () => tone(220, 0.04, "triangle", 0.05),
    ok: () => { tone(660, 0.09); tone(880, 0.14, "sine", 0.07, 0.08); tone(1320, 0.2, "sine", 0.05, 0.16); },
    bad: () => { tone(220, 0.18, "sawtooth", 0.06); tone(160, 0.28, "sawtooth", 0.06, 0.12); },
    tick: () => tone(1000, 0.03, "square", 0.025),
    spin: () => tone(500 + E.int(300), 0.03, "triangle", 0.04),
    tension: () => { tone(110, 0.5, "sine", 0.05); tone(116, 0.5, "sine", 0.05); },
    win: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "triangle", 0.08, i * 0.11)); tone(1047, 0.6, "sine", 0.06, 0.48); },
    lose: () => { [392, 349, 311, 262].forEach((f, i) => tone(f, 0.25, "triangle", 0.06, i * 0.16)); }
  };
})();

/* ======================================================================
   GENEROWANIE PYTAŃ DLA TRYBU
   ====================================================================== */
const asItem = (q) => ({ id: q.id, type: q.type, q: q.q, a: q.a, opts: E.options(q), cat: q.cat, sub: q.sub, diff: q.diff, expl: q.expl || "" });
App.genItems = function (cfg, n, seen) {
  const ex = new Set([...(seen || [])]);
  if (cfg.kind === "q") {
    const r = E.draw(App.data.live, Object.assign({}, cfg.draw, { count: n, exclude: ex, used: S.usage, avoidUsed: S.settings.avoidUsed }));
    return r.questions.map(asItem);
  }
  if (cfg.kind === "flag") {
    const f = cfg.flag || {};
    let pool = App.flagsPool();
    if (f.region && f.region !== "all" && f.region !== "look") pool = pool.filter((c) => c.cont === f.region);
    if (f.region === "look") { const s = new Set(SQP.FLAG_LOOKALIKES.flat()); pool = pool.filter((c) => s.has(c.iso)); }
    if (f.diff && f.diff !== "all") pool = pool.filter((c) => c.diff === +f.diff);
    const pick = E.shuffle(pool.filter((c) => !ex.has("flag-" + c.iso))).slice(0, n);
    const all = App.flagsPool();
    return pick.map((c) => {
      const wrong = E.flagDistractors(c, all, 3, SQP.FLAG_LOOKALIKES);
      const v = f.variant === "mix" ? E.pick(["name4", "flag4"]) : f.variant;
      if (v === "flag4") return { id: "flag-" + c.iso, type: "flagrev", q: c.name, a: c.iso, opts: E.shuffle([c.iso].concat(wrong.map((w) => w.iso))), cat: "geo", sub: "Flagi", diff: c.diff, iso: c.iso, names: Object.fromEntries([c].concat(wrong).map((x) => [x.iso, x.name])) };
      if (v === "type") return { id: "flag-" + c.iso, type: "flagtype", q: "Co to za państwo?", a: c.name, iso: c.iso, opts: [], cat: "geo", sub: "Flagi", diff: c.diff };
      return { id: "flag-" + c.iso, type: "flag", q: "Co to za państwo?", a: c.name, iso: c.iso, opts: E.shuffle([c.name].concat(wrong.map((w) => w.name))), cat: "geo", sub: "Flagi", diff: c.diff };
    });
  }
  if (cfg.kind === "chrono") {
    const ev = App.data.events; const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 500) {
      const [a, b] = E.sample(ev, 2);
      if (Math.abs(a.y - b.y) < 3) continue;
      const id = "chr-" + [a.id, b.id].sort().join("-"); if (ex.has(id) || out.some((o) => o.id === id)) continue;
      const gap = Math.abs(a.y - b.y);
      out.push({ id, type: "chrono", q: "Co wydarzyło się wcześniej?", a: a.y < b.y ? a.t : b.t, opts: [a.t, b.t], years: { [a.t]: a.y, [b.t]: b.y }, cat: "hist", sub: "Chronologia", diff: gap > 100 ? 1 : gap > 20 ? 2 : 3 });
    }
    return out;
  }
  if (cfg.kind === "num") return E.shuffle(App.data.estimates.filter((x) => !ex.has(x.id))).slice(0, n).map((x) => ({ id: x.id, type: "num", q: x.q, a: x.a, unit: x.unit, opts: [], cat: "ogol", sub: "Szacowanie", diff: 2 }));
  if (cfg.kind === "photo") {
    const ph = S.photos.filter((p) => !ex.has("ph-" + p.id) && (!cfg.photoCat || cfg.photoCat === "all" || p.cat === cfg.photoCat));
    return E.shuffle(ph).slice(0, n).map((p) => {
      const others = E.shuffle(S.photos.filter((x) => x.name !== p.name).map((x) => x.name));
      const wrong = [...new Set((p.wrong || []).filter(Boolean).concat(others))].filter((w) => w !== p.name).slice(0, 3);
      return { id: "ph-" + p.id, type: "photo", q: "Kto to jest?", a: p.name, photo: p.id, opts: E.shuffle([p.name].concat(wrong)), cat: "pop", sub: p.cat || "Zdjęcia", diff: 2, reveal: cfg.reveal || "full" };
    });
  }
  return [];
};

Game.start = function (cfg) {

  else hud.push(`<div><b id="hudScore">${G.score}</b><span>Punkty</span></div>`);
  if (!G.players) hud.push(`<div><b>${G.ok}${total ? "/" + total : ""}</b><span>Poprawne</span></div>`);
  if (G.lives != null) hud.push(`<div><b>${"♥".repeat(Math.max(0, G.lives)) || "—"}</b><span>Życia</span></div>`);
  else if (G.cfg.total) hud.push(`<div><b id="hudTime">${Math.ceil(G.totalLeft)}</b><span>Sekundy</span></div>`);
  else if (!G.players) hud.push(`<div><b>${Math.min(G.i + 1, total || G.i + 1)}${total ? "/" + total : ""}</b><span>Pytanie</span></div>`);
  return `<div class="ghead"><button class="iconbtn" data-act="quit" aria-label="Zakończ">${ICON.x}</button><div class="title">${esc(G.cfg.name)}${G.cfg.player ? " · " + esc(G.cfg.player) : ""}</div>
    <button class="iconbtn ${G.pview ? "on" : ""}" data-act="pview" aria-label="Tryb uczestnika" title="Tryb uczestnika ukrywa podpowiedzi prowadzącego">${G.pview ? ICON.eyeoff : ICON.eye}</button></div>
    <div class="hud" style="grid-template-columns:repeat(${hud.length},1fr)">${hud.join("")}</div>
    ${total ? `<div class="progress"><i style="width:${(G.i / total) * 100}%"></i></div>` : ""}`;
};

Game.render = function () {
  stopTimers();
  const st = S.settings;
  if (!G.cfg.endless && G.i >= G.cfg.count) return Game.finish();
  if (G.cfg.endless && !G.items[G.i]) { const more = App.genItems(G.cfg, 1, G.items.map((x) => x.id)); if (!more.length) return Game.finish("Skończyły się pytania w tej puli"); G.items.push(more[0]); }
  persist();
  const root = stageEl();
  /* wybór trudności lub stawki przed pytaniem */
  if (G.phase === "choose") {
    const isStake = G.cfg.chooser === "stake";
    const item = G.items[G.i];
    root.innerHTML = `<div class="in">${Game.header()}<div class="qbox" style="text-align:center">
      <div class="eyebrow">Pytanie ${G.i + 1} z ${G.cfg.count}</div>
      <div class="qtext">${isStake ? "Ile stawiasz?" : "Jakie pytanie bierzesz?"}</div>
      ${isStake ? `<p class="muted">Kategoria: <b>${esc(CAT[item.cat] ? CAT[item.cat].name : item.cat)}</b> · trudność ${"●".repeat(item.diff)}${"○".repeat(3 - item.diff)}<br>Masz ${G.score} pkt. Dobra odpowiedź dodaje stawkę, zła odejmuje.</p>` : `<p class="muted">Łatwe = 100 pkt, średnie = 200 pkt, trudne = 300 pkt.</p>`}
    </div><div class="answers">${(isStake ? [100, 250, 500, "all"] : [1, 2, 3]).map((v) => `<button class="ans" data-act="choose" data-v="${v}" ${isStake && v !== "all" && v > G.score ? "disabled" : ""}><span class="k">${isStake ? "×" : "●".repeat(v)}</span>${isStake ? (v === "all" ? `Wszystko (${G.score})` : v + " pkt") : ["Łatwe", "Średnie", "Trudne"][v - 1] + ` — ${v * 100} pkt`}</button>`).join("")}</div></div>`;
    App.bind(root, {
      quit: Game.quit, pview: () => { G.pview = !G.pview; Game.render(); },
      choose: (el) => {
        Snd.tap();
        if (isStake) { G.stake = el.dataset.v === "all" ? G.score : +el.dataset.v; if (G.stake <= 0) G.stake = 100; }
        else { const d = +el.dataset.v; const q = App.genItems(Object.assign({}, G.cfg, { draw: Object.assign({}, G.cfg.draw, { diffs: [d] }) }), 1, G.items.map((x) => x.id).concat(G.answers.map((a) => a.id))); if (q[0]) G.items[G.i] = q[0]; G.stake = d * 100; }
        G.phase = "q"; Game.render();
      }
    });
    return;
  }
  const it = G.items[G.i];
  const answered = G.cur && G.cur.done;
  const hint = st.showHint && !G.pview;
  let body = "";
  const media = it.type === "flag" || it.type === "flagtype" ? `<div class="qimg">${App.flagImg(it.iso)}</div>`
    : it.type === "photo" ? `<div class="photo"><img id="phImg" alt="Zdjęcie do rozpoznania"></div>` : "";
  const qtext = it.type === "flagrev" ? `Która flaga to: ${it.q}?` : it.q;
  const ansBtn = (o, i, label) => {
    const st2 = answered ? (o === it.a ? "good" : o === G.cur.pick ? "bad" : "dim") : "";
    const yr = it.type === "chrono" && answered ? `<span class="year">${it.years[o]}</span>` : "";
    return `<button class="ans ${st2}" data-act="ans" data-i="${i}" ${answered ? "disabled" : ""}><span class="k">${it.type === "tf" ? "" : LETTERS[i]}</span><span>${label}</span>${yr}${hint && !answered && o === it.a ? '<span class="hint" aria-hidden="true"></span>' : ""}</button>`;
  };
  if (it.type === "flagrev") body = `<div class="answers flags">${it.opts.map((o, i) => { const s = answered ? (o === it.a ? "good" : o === G.cur.pick ? "bad" : "dim") : ""; return `<button class="ans ${s}" data-act="ans" data-i="${i}" ${answered ? "disabled" : ""} aria-label="Flaga ${LETTERS[i]}">${App.flagImg(o)}${hint && !answered && o === it.a ? '<span class="hint"></span>' : ""}${answered ? `<span class="small" style="position:absolute;bottom:4px;left:0;right:0;text-align:center">${esc(it.names[o])}</span>` : ""}</button>`; }).join("")}</div>`;
  else if (it.type === "tf") body = `<div class="answers tf">${it.opts.map((o, i) => ansBtn(o, i, o)).join("")}</div>`;
  else if (it.type === "flagtype" || it.type === "num") body = answered ? `<div class="card" style="text-align:center"><div class="eyebrow">Poprawna odpowiedź</div><div class="h2" style="margin-top:6px">${esc(it.type === "num" ? String(it.a).replace(".", ",") + " " + it.unit : it.a)}</div>${G.cur.pick != null ? `<p class="muted" style="margin:6px 0 0">Odpowiedź: ${esc(G.cur.pick || "—")}${it.type === "num" ? ` · +${G.cur.points} pkt` : ""}</p>` : ""}</div>`
    : `<div class="stack"><input class="inp" id="typeIn" ${it.type === "num" ? 'inputmode="decimal"' : 'autocapitalize="words"'} autocomplete="off" placeholder="${it.type === "num" ? "Twoja odpowiedź" + (it.unit ? " (" + esc(it.unit) + ")" : "") : "Nazwa państwa"}" style="font-size:22px;min-height:64px"><div class="grid2"><button class="btn ghost" data-act="dunno">Nie wiem</button><button class="btn dark" data-act="typed">Sprawdź</button></div>${hint && it.type === "flagtype" ? `<p class="small muted" style="margin:0">Dla prowadzącego: ${esc(it.a)}</p>` : ""}</div>`;
  else body = `<div class="answers ${it.type === "chrono" ? "vs2" : ""}">${it.opts.map((o, i) => ansBtn(o, i, esc(o))).join("")}</div>`;
  if (it.type === "photo" && !answered && it.reveal !== "full") body = `<button class="btn ghost full" data-act="reveal">Odsłoń więcej (−100 pkt)</button>` + body;

  const meta = [];
  if (it.cat && CAT[it.cat]) meta.push(`<span class="pill">${esc(CAT[it.cat].name)}${it.sub ? " · " + esc(it.sub) : ""}</span>`);
  meta.push(`<span class="pill">${"●".repeat(it.diff || 1)}${"○".repeat(3 - (it.diff || 1))}</span>`);
  if (G.stake) meta.push(`<span class="pill acc">Stawka ${G.stake}</span>`);
  const p = turnPlayer(); if (p) meta.push(`<span class="pill acc">Odpowiada: ${esc(p.name)}</span>`);

  root.innerHTML = `<div class="in">${Game.header()}
    ${G.cfg.perQ && !answered ? `<div class="timer" id="qTimer"><i style="width:100%"></i></div>` : ""}
    <div class="qbox"><div class="qmeta">${meta.join("")}</div>${media}<div class="qtext ${qLong(qtext) ? "long" : ""}">${esc(qtext)}</div></div>
    ${body}
    ${answered && it.expl ? `<div class="expl">${esc(it.expl)}</div>` : ""}
    ${answered ? `<button class="btn primary xl full" data-act="next">${G.over ? "Wynik" : "Dalej →"}</button>` : ""}
    ${!G.pview ? `<div class="hostbar no-print">${!answered ? `<button class="btn sm" data-act="skip">Pomiń</button>` : ""}<button class="btn sm" data-act="pts" data-v="-100">−100</button><button class="btn sm" data-act="pts" data-v="100">+100</button><button class="btn sm" data-act="board">Plansza</button></div>` : ""}
  </div>`;
  if (it.type === "photo") { const ph = S.photos.find((x) => "ph-" + x.id === it.id); const img = $("#phImg"); if (ph && img) { img.src = ph.data; Game.applyReveal(img, it, answered); } }
  App.bind(root, {
    quit: Game.quit, pview: () => { G.pview = !G.pview; Game.render(); },
    ans: (el) => Game.answer(it.opts[+el.dataset.i]),
    typed: () => Game.answer($("#typeIn").value), dunno: () => Game.answer(null),
    next: () => { Snd.tap(); Game.next(); },
    skip: () => { G.skipped++; const r = App.genItems(G.cfg, 1, G.items.map((x) => x.id)); if (r[0]) { G.items[G.i] = r[0]; G.cur = null; Game.render(); } else App.toast("Brak kolejnych pytań w puli"); },
    pts: (el) => { const v = +el.dataset.v; const pl = turnPlayer(); if (pl) pl.score += v; else G.score += v; persist(); Game.render(); App.toast((v > 0 ? "+" : "") + v + " pkt"); },
    board: () => App.boardForQuestion(it),
    reveal: () => { it.level = (it.level || 0) + 1; Game.render(); }
  });
  const ti = $("#typeIn"); if (ti) { ti.focus(); ti.addEventListener("keydown", (e) => { if (e.key === "Enter") Game.answer(ti.value); }); }
  /* liczniki czasu */
  if (!answered && (G.cfg.perQ || G.cfg.total)) {
    const t0 = Date.now(); const per = G.cfg.perQ * 1000; let lastTick = -1;
    const totalStart = G.totalLeft;
    tmr = setInterval(() => {
      const el = Date.now() - t0;
      if (G.cfg.total) { G.totalLeft = Math.max(0, totalStart - el / 1000); const h = $("#hudTime"); if (h) h.textContent = Math.ceil(G.totalLeft); if (G.totalLeft <= 0) { stopTimers(); Snd.bad(); return Game.finish(); } }
      if (per) { const left = Math.max(0, per - el); const bar = $("#qTimer"); if (bar) { bar.firstChild.style.width = (left / per) * 100 + "%"; bar.classList.toggle("low", left < 3000); } const s = Math.ceil(left / 1000); if (s <= 3 && s !== lastTick && s > 0) { lastTick = s; Snd.tick(); } if (left <= 0) { stopTimers(); Game.answer(undefined, true); } }
    }, 100);
  }
};
Game.applyReveal = function (img, it, answered) {
  if (answered || it.reveal === "full") { img.style.filter = "none"; img.style.transform = "none"; return; }
  const lv = it.level || 0;
  if (it.reveal === "blur") img.style.filter = `blur(${[28, 16, 8, 3][Math.min(lv, 3)]}px)`;
  if (it.reveal === "zoom") { img.style.transform = `scale(${[4, 2.6, 1.7, 1.15][Math.min(lv, 3)]})`; img.style.transformOrigin = it.origin || (it.origin = `${20 + E.int(60)}% ${20 + E.int(50)}%`); }
};

Game.answer = function (pick, timeout) {
  if (G.cur && G.cur.done) return;
  stopTimers();
  const it = G.items[G.i];
  let ok, points = 0;
  if (it.type === "flagtype") { const c = App.data.countries.find((x) => x.iso === it.iso); ok = pick != null && E.nameMatches(pick, c); }
  else if (it.type === "num") { points = pick == null || pick === "" ? 0 : E.estimateScore(it.a, pick); ok = points >= 100; }
  else ok = pick != null && String(pick) === String(it.a);
  if (it.type !== "num") {
    if (G.stake) points = ok ? G.stake : (G.cfg.chooser === "stake" ? -G.stake : 0);
    else if (it.type === "photo") points = ok ? Math.max(100, 400 - 100 * ((it.level || 0) + (it.reveal !== "full" ? 0 : 1))) : 0;
    else if (it.type === "flag" || it.type === "flagrev" || it.type === "flagtype") points = ok ? 100 * it.diff : 0;
    else points = ok ? E.points(it) : 0;
  }
  G.cur = { done: true, pick: pick == null ? null : String(pick), ok, points };
  const pl = turnPlayer();
  if (pl) { pl.score += points; if (ok) pl.ok++; }
  G.score += points;
  if (ok) G.ok++; else G.bad++;
  if (!ok && G.lives != null) G.lives--;
  G.answers.push({ id: it.id, q: it.type === "flagrev" ? "Flaga: " + it.q : it.type.startsWith("flag") ? "Flaga: " + it.a : it.q, cat: it.cat, ok, pick: G.cur.pick, a: String(it.a) });
  S.usage[it.id] = (S.usage[it.id] || 0) + 1; App.save("usage");
  G.stake = 0;
  if (G.lives != null && G.lives <= 0) G.over = true;
  if (!G.cfg.endless && G.i + 1 >= G.cfg.count) G.over = true;
  if (ok) { Snd.ok(); if (points > 0 && S.settings.anim) { const f = document.createElement("div"); f.className = "float"; f.textContent = "+" + points; document.body.appendChild(f); setTimeout(() => f.remove(), 1000); } }
  else { Snd.bad(); if (timeout) App.toast("Koniec czasu!"); try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} }
  Game.render();
  if (S.settings.autoNext || G.cfg.total) { const i = G.i; setTimeout(() => { if (G && G.i === i && G.cur && G.cur.done) Game.next(); }, G.cfg.total ? 700 : 2200); }
};
Game.next = function () {
  if (G.over) return Game.finish();
  G.i++; G.cur = null; if (G.cfg.chooser) G.phase = "choose";
  Game.render();
};
Game.quit = function () {
  App.sheet("Przerwać grę?", `<p class="muted" style="margin-top:0">Możesz zapisać dotychczasowy wynik w historii albo wrócić do gry później.</p><div class="stack"><button class="btn dark" data-act="save">Zakończ i zapisz wynik</button><button class="btn" data-act="later">Wróć później (gra zostaje zapisana)</button><button class="btn ghost" data-act="back">Graj dalej</button></div>`, {
    save: () => { App.closeSheet(); Game.finish("Zakończona przez prowadzącego"); },
    later: () => { App.closeSheet(); stopTimers(); persist(); App.closeStage(); },
    back: App.closeSheet
  });
};
App.closeStage = function () { stopTimers(); stageEl().hidden = true; stageEl().innerHTML = ""; document.body.style.overflow = ""; App.go(App.view || "home"); };

Game.finish = function (note) {
  stopTimers();
  const g = G; G = null;
  S.inprogress = null; App.save("inprogress");
  const asked = g.answers.length;
  const rec = App.record({ mode: g.cfg.mode, modeName: g.cfg.name, player: g.cfg.player || (g.players ? g.players.map((p) => `${p.name} (${p.score})`).join(" vs ") : ""), asked, ok: g.ok, bad: g.bad, score: g.score, duration: Date.now() - g.start, answers: g.answers, consent: g.cfg.consent, note: note || "", status: note ? "zakończona wcześniej" : "zakończona" });
  let prizeId = null;
  if (!g.players) {
    const rule = g.cfg.quiz ? { prize: g.cfg.quiz.prize, min: g.cfg.quiz.min } : S.rules[g.cfg.rule || g.cfg.mode];
    const min = g.cfg.passMin || (rule && rule.min);
    if (rule && rule.prize && ((min && g.ok >= min) || (rule.score && g.score >= rule.score))) prizeId = rule.prize;
  }
  App.showResult(rec, { prizeId, players: g.players, win: g.players ? null : prizeId ? true : asked ? g.ok / asked >= 0.7 : false, cfg: g.cfg });
};

/* ======================================================================
   TELETURNIEJ 15 PYTAŃ
   ====================================================================== */
const Ladder = App.Ladder = {};
let L = null;
const lpersist = () => { if (!L) return; S.inprogress = { name: "Teleturniej 15 pytań", player: L.cfg.player, kind: "ladder", L }; App.save("inprogress"); };
Ladder.start = function (cfg) {
  const qs = E.ladderDraw(App.data.live, { used: S.usage, avoidUsed: S.settings.avoidUsed });
  if (qs.length < 15) return App.toast("Za mało pytań w bazie do teleturnieju");
  L = { cfg, items: qs.map(asItem), i: 0, start: Date.now(), used: {}, opts: null, aud: null, phone: null, answers: [], extra: 0, done: false };
  L.opts = L.items[0].opts.slice();
  stageEl().hidden = false; document.body.style.overflow = "hidden";
  Ladder.render();
};
Ladder.resume = function (saved) { L = saved; L.done = false; stageEl().hidden = false; document.body.style.overflow = "hidden"; Ladder.render(); };
const lvl = (n) => S.ladder[n - 1] || { label: n * 100 + " pkt" };
const safeLevel = (i) => { let s = 0; for (let k = 1; k <= i; k++) if (lvl(k).safe) s = k; return s; };
Ladder.render = function () {
  stopTimers(); lpersist();
  const it = L.items[L.i], root = stageEl(), hint = S.settings.showHint && !L.pview;
  const ladderHtml = S.ladder.slice().reverse().map((l) => `<div class="${l.n === L.i + 1 ? "cur" : l.n <= L.i ? "done" : ""} ${l.safe ? "safe" : ""}"><span>${l.n}</span><span>${esc(l.label)}</span></div>`).join("");
  const timeLimit = 45 + L.extra;
  root.innerHTML = `<div class="in">
    <div class="ghead"><button class="iconbtn" data-act="quit" aria-label="Zakończ">${ICON.x}</button><div class="title">Teleturniej${L.cfg.player ? " · " + esc(L.cfg.player) : ""}</div><button class="iconbtn ${L.pview ? "on" : ""}" data-act="pview" aria-label="Tryb uczestnika">${L.pview ? ICON.eyeoff : ICON.eye}</button><button class="iconbtn" data-act="ladder" aria-label="Drabinka">${ICON.ladder}</button></div>
    <div class="hud" style="grid-template-columns:1fr 1fr"><div><b>${L.i + 1}/15</b><span>Pytanie</span></div><div><b style="font-size:16px;line-height:1.6">${esc(lvl(L.i + 1).label)}</b><span>Gra o</span></div></div>
    <div class="timer" id="qTimer"><i style="width:100%"></i></div>
    <div class="lifelines">
      <button class="ll" data-act="ll" data-k="5050" ${L.used["5050"] || L.done ? "disabled" : ""}>50:50</button>
      <button class="ll" data-act="ll" data-k="aud" ${L.used.aud || L.done ? "disabled" : ""}>Publiczność<small>symulacja</small></button>
      <button class="ll" data-act="ll" data-k="phone" ${L.used.phone || L.done ? "disabled" : ""}>Telefon<small>symulacja</small></button>
      <button class="ll" data-act="ll" data-k="swap" ${L.used.swap || L.done ? "disabled" : ""}>Zamiana</button>
      <button class="ll" data-act="ll" data-k="time" ${L.used.time || L.done ? "disabled" : ""}>+30 s</button>
    </div>
    <div class="qbox"><div class="qmeta"><span class="pill">${esc(CAT[it.cat] ? CAT[it.cat].name : "")}</span></div><div class="qtext ${qLong(it.q) ? "long" : ""}">${esc(it.q)}</div></div>
    ${L.phone ? `<div class="notice"><b>Symulacja telefonu:</b> „Myślę, że to ${esc(L.phone.answer)}. Jestem pewny na ${L.phone.confidence}%.”</div>` : ""}
    <div class="answers">${L.opts.map((o, i) => { if (o == null) return `<button class="ans gone" disabled><span class="k">${LETTERS[i]}</span></button>`; const s = L.done ? (o === it.a ? "good" : o === L.pick ? "bad" : "dim") : L.sel === o ? "sel" : ""; return `<button class="ans ${s}" data-act="ans" data-i="${i}" ${L.done ? "disabled" : ""}><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span>${L.aud ? `<span class="pct">${L.aud[i]}%</span><span class="aud" style="width:${L.aud[i]}%"></span>` : ""}${hint && !L.done && o === it.a ? '<span class="hint"></span>' : ""}</button>`; }).join("")}</div>
    ${L.aud ? `<p class="small muted" style="margin:0">Wynik publiczności to symulacja oparta na trudności pytania.</p>` : ""}
    ${L.sel && !L.done ? `<div class="grid2"><button class="btn" data-act="unsel">Zmień</button><button class="btn primary" data-act="final">Ostateczna odpowiedź</button></div>` : ""}
    ${L.done ? `<button class="btn primary xl full" data-act="next">${L.lost || L.i === 14 ? "Wynik" : "Następne pytanie →"}</button>` : `<button class="btn ghost" data-act="walk">Rezygnuję i biorę: ${esc(L.i ? lvl(L.i).label : "nic")}</button>`}
  </div>`;
  App.bind(root, {
    quit: () => App.confirm("Przerwać teleturniej?", "Wynik zostanie zapisany z aktualnym progiem.", "Zakończ", () => Ladder.finish(L.i, "przerwana")),
    pview: () => { L.pview = !L.pview; Ladder.render(); },
    ladder: () => App.sheet("Drabinka", `<div class="ladder">${ladderHtml}</div>`),
    ans: (el) => { Snd.tap(); L.sel = L.opts[+el.dataset.i]; Ladder.render(); },
    unsel: () => { L.sel = null; Ladder.render(); },
    final: () => Ladder.answer(L.sel),
    ll: (el) => Ladder.lifeline(el.dataset.k),
    walk: () => App.confirm("Rezygnacja", `Uczestnik kończy z: ${L.i ? lvl(L.i).label : "brak nagrody"}.`, "Rezygnuję", () => Ladder.finish(L.i, "rezygnacja")),
    next: () => { if (L.lost) return Ladder.finish(safeLevel(L.i), "błędna odpowiedź"); if (L.i === 14) return Ladder.finish(15, "komplet"); L.i++; L.done = false; L.sel = null; L.pick = null; L.aud = null; L.phone = null; L.extra = 0; L.opts = L.items[L.i].opts.slice(); Ladder.render(); }
  });
  if (!L.done) {
    const t0 = Date.now(), per = timeLimit * 1000; let last = -1;
    tmr = setInterval(() => { const left = Math.max(0, per - (Date.now() - t0)); const bar = $("#qTimer"); if (bar) { bar.firstChild.style.width = (left / per) * 100 + "%"; bar.classList.toggle("low", left < 10000); } const s = Math.ceil(left / 1000); if (s <= 10 && s !== last && s > 0) { last = s; Snd.tick(); } if (left <= 0) { stopTimers(); Ladder.answer(null); } }, 100);
  }
};
Ladder.lifeline = function (k) {
  const it = L.items[L.i]; L.used[k] = true; Snd.tension();
  if (k === "5050") L.opts = E.lifeline5050(it, L.opts);
  if (k === "aud") L.aud = E.audience(it, L.opts);
  if (k === "phone") L.phone = E.phoneFriend(it, L.opts);
  if (k === "time") L.extra += 30;

  g = x.createRadialGradient(0, 1920, 50, 0, 1920, 1200); g.addColorStop(0, acc2 + "77"); g.addColorStop(1, "#0d0b1000"); x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);

App.pairsGame = function (set, player) {
  let src = set === "__cap" ? App.data.countries.filter((c) => !c.territory && !c.noCap && c.capital !== c.name && c.diff <= 2).map((c) => [c.name, c.capital]) : App.data.pairs[set];
  const rounds = 2, per = 5; let round = 0, score = 0, mistakes = 0, ok = 0; const start = Date.now(); const answers = [];
  let left, right, sel = null, matched;
  const deal = () => { const p = E.sample(src, per); left = p.map((x) => x[0]); right = E.shuffle(p.map((x) => x[1])); matched = new Set(); sel = null; src = src.filter((x) => !p.includes(x)); App.pairsCur = Object.fromEntries(p); };
  deal();
  stageEl().hidden = false; document.body.style.overflow = "hidden";
  const render = () => {
    stageEl().innerHTML = `<div class="in"><div class="ghead"><button class="iconbtn" data-act="quit">${ICON.x}</button><div class="title">Dopasuj pary · runda ${round + 1}/${rounds}</div></div>
      <div class="hud"><div><b>${score}</b><span>Punkty</span></div><div><b>${ok}/${rounds * per}</b><span>Pary</span></div><div><b>${mistakes}</b><span>Błędy</span></div></div>
      <p class="muted" style="margin:0">Stuknij element po lewej, potem pasujący po prawej.</p>
      <div class="pairs"><div class="col">${left.map((l, i) => `<button class="ans ${matched.has(l) ? "good" : sel === l ? "sel" : ""}" data-act="l" data-i="${i}" ${matched.has(l) ? "disabled" : ""}>${esc(l)}</button>`).join("")}</div>
      <div class="col">${right.map((r, i) => `<button class="ans ${[...matched].some((l) => App.pairsCur[l] === r) ? "good" : ""}" data-act="r" data-i="${i}" ${[...matched].some((l) => App.pairsCur[l] === r) ? "disabled" : ""}>${esc(r)}</button>`).join("")}</div></div></div>`;
    App.bind(stageEl(), {
      quit: () => App.closeStage(),
      l: (el) => { sel = left[+el.dataset.i]; Snd.tap(); render(); },
      r: (el) => {
        if (!sel) return App.toast("Najpierw wybierz element po lewej");
        const r = right[+el.dataset.i];
        if (App.pairsCur[sel] === r) { matched.add(sel); ok++; score += 100; Snd.ok(); answers.push({ id: "pair-" + E.hash(sel), q: sel + " → " + r, cat: "ogol", ok: true }); sel = null; }
        else { mistakes++; score = Math.max(0, score - 25); Snd.bad(); el.classList.add("bad"); answers.push({ id: "pair-" + E.hash(sel), q: sel, cat: "ogol", ok: false }); setTimeout(render, 450); return; }
        if (matched.size === per) { round++; if (round >= rounds || src.length < per) { const rec = App.record({ mode: "pairs", modeName: "Dopasuj pary", player, asked: ok + mistakes, ok, bad: mistakes, score, duration: Date.now() - start, answers, consent: "nagrana", status: "zakończona" }); const rule = S.rules.pairs; return App.showResult(rec, { prizeId: rule && rule.prize && mistakes <= 1 ? rule.prize : null, win: mistakes <= 2 }); } deal(); }
        render();
      }
    });
  };
  render();
};

    <div class="grid2" style="margin-top:10px"><label class="f">Kategoria<select class="inp" id="eC">${Object.keys(CAT).map((k) => `<option value="${k}" ${k === q.cat ? "selected" : ""}>${esc(CAT[k].name)}</option>`).join("")}</select></label><label class="f">Trudność<select class="inp" id="eD">${[1, 2, 3].map((d) => `<option value="${d}" ${d === q.diff ? "selected" : ""}>${["", "Łatwe", "Średnie", "Trudne"][d]}</option>`).join("")}</select></label></div>

    save: () => {

      const dup = App.data.all.find((x) => E.norm(x.q) === E.norm(text) && x.id !== q.id);
      if (dup && (isNew || dup.id !== q.id)) return App.toast("Takie pytanie już jest w bazie");

      if (isNew) S.custom.unshift(obj); else S.custom = S.custom.map((x) => (x.id === q.id ? obj : x));

function exportSheet() {

function aiSheet() {
