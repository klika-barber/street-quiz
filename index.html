/* ---------- zdjęcia do „Kto to jest?” ---------- */
SUB.photos = function (el) {
  el.innerHTML = `<div class="notice"><b>Tylko zdjęcia, do których masz prawa.</b> Własne zdjęcia (za zgodą osoby na zdjęciu) albo zdjęcia z wolną licencją, np. z Wikimedia Commons (CC BY / CC BY-SA / domena publiczna) — przy CC zapisz autora i licencję, a przy publikacji rolki podaj je w opisie. Zdjęcie z wyszukiwarki Google zwykle nie daje prawa do użycia.</div>
    <label class="btn dark full" style="margin-top:12px">${ICON.upload} Dodaj zdjęcia<input type="file" accept="image/*" multiple data-act="up" hidden></label>
    <p class="small muted">${S.photos.length} zdjęć · tryb wymaga minimum 4. Zdjęcia są zmniejszane i zapisywane tylko na tym urządzeniu.</p>
    <div class="list">${S.photos.map((p) => `<button class="li" data-act="edit" data-id="${p.id}"><img src="${p.data}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:10px"><span class="t"><b>${esc(p.name || "Bez podpisu")}</b><span>${esc(p.cat || "Zdjęcia")} · ${p.license ? esc(p.license) : "<span style=\"color:var(--bad)\">brak informacji o licencji</span>"}</span></span></button>`).join("")}</div>`;
  const re = () => SUB.photos(el);
  App.bind(el, {
    up: async (i) => {
      const files = [...i.files]; if (!files.length) return; App.toast("Wczytuję…");
      const added = [];
      for (const f of files) { const d = await shrink(f, 900); if (d) { const p = { id: uid(), name: f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "), cat: "Zdjęcia", wrong: [], license: "", author: "", data: d }; S.photos.push(p); added.push(p); } }
      try { await App.save("photos"); } catch (e) { App.toast("Brak miejsca na zdjęcia"); }
      re(); if (added.length) photoSheet(added[0], re);
    },
    edit: (b) => photoSheet(S.photos.find((p) => p.id === b.dataset.id), re)
  });
};
function photoSheet(p, after) {
  App.sheet("Opis zdjęcia", `<img src="${p.data}" alt="" style="width:100%;max-height:260px;object-fit:contain;border-radius:14px;background:var(--surface-2)">
    <label class="f" style="margin-top:10px">Kto jest na zdjęciu (poprawna odpowiedź)<input class="inp" id="phN" maxlength="40" value="${esc(p.name)}"></label>
    <label class="f" style="margin-top:10px">Kategoria<input class="inp" id="phC" maxlength="24" value="${esc(p.cat || "")}" placeholder="np. Piłkarze, Raperzy, Aktorzy" list="phCats"><datalist id="phCats">${[...new Set(S.photos.map((x) => x.cat).filter(Boolean))].map((c) => `<option value="${esc(c)}">`).join("")}</datalist></label>
    <label class="f" style="margin-top:10px">Błędne odpowiedzi (po przecinku, opcjonalnie)<input class="inp" id="phW" maxlength="120" value="${esc((p.wrong || []).join(", "))}" placeholder="pozostałe dobierzemy z innych zdjęć"></label>
    <div class="grid2" style="margin-top:10px"><label class="f">Autor zdjęcia<input class="inp" id="phA" maxlength="60" value="${esc(p.author || "")}"></label><label class="f">Licencja / źródło<input class="inp" id="phL" maxlength="80" value="${esc(p.license || "")}" placeholder="np. CC BY-SA 4.0, Wikimedia"></label></div>
    <button class="btn dark full" style="margin-top:12px" data-act="save">Zapisz</button><button class="btn danger full" style="margin-top:8px" data-act="del">Usuń zdjęcie</button>`, {
    save: () => { p.name = $("#phN").value.trim(); p.cat = $("#phC").value.trim() || "Zdjęcia"; p.wrong = $("#phW").value.split(",").map((x) => x.trim()).filter(Boolean).slice(0, 3); p.author = $("#phA").value.trim(); p.license = $("#phL").value.trim(); if (!p.name) return App.toast("Podaj, kto jest na zdjęciu"); App.save("photos"); App.closeSheet(); after(); },
    del: () => App.confirm("Usunąć zdjęcie?", p.name || "", "Usuń", () => { S.photos = S.photos.filter((x) => x.id !== p.id); App.save("photos"); after(); }, true)
  });
}

/* ---------- prywatność, zgody, PIN ---------- */
SUB.privacy = function (el) {
  const noC = S.history.filter((h) => h.consent === "brak" || h.consent === "wycofana");
  const named = S.history.filter((h) => h.player).length;
  el.innerHTML = `<div class="card"><b>PIN panelu prowadzącego</b><p class="small muted">PIN blokuje Wyniki, Nagrody i ten panel. Uczestnik z telefonem w ręku zobaczy tylko Start i Tryby. PIN jest zapisany jako skrót, nie wprost.</p>
    ${S.settings.pin ? `<div class="grid2"><button class="btn" data-act="pin">Zmień PIN</button><button class="btn danger" data-act="nopin">Wyłącz PIN</button></div>` : `<button class="btn dark full" data-act="pin">${ICON.lock} Ustaw PIN</button>`}</div>
  <div class="card" style="margin-top:12px"><b>Jakie dane zbiera aplikacja</b><p class="small muted" style="margin-bottom:0">Tylko opcjonalny pseudonim, wynik, odpowiedzi, status zgody na publikację i kod vouchera. Aplikacja nie pyta o nazwisko, telefon ani e-mail i nie wysyła niczego na serwer — wszystko zostaje na tym urządzeniu.</p></div>
  <div class="card" style="margin-top:12px"><b>Zgody na publikację</b><p class="small muted">Udział w quizie nie oznacza zgody na publikację nagrania. Status zgody zapisujesz przy każdej grze i możesz go zmienić w Wyniki → Historia.</p>
    ${noC.length ? `<div class="list">${noC.map((h) => `<div class="li"><span class="rank">${h.no}</span><span class="t"><b>${esc(h.player || "Anonim")}</b><span>${fmtDT(h.date)} · ${esc(h.modeName)}${h.note ? " · " + esc(h.note) : ""}</span></span><span class="pill bad">${esc(h.consent)}</span></div>`).join("")}</div><p class="small" style="color:var(--bad)">Tych nagrań nie publikuj.</p>` : `<p class="small" style="margin:0">Brak gier oznaczonych „bez zgody”.</p>`}
    <button class="btn full" style="margin-top:10px" data-act="clog">${ICON.download} Eksport rejestru zgód (CSV)</button></div>
  <div class="card" style="margin-top:12px"><b>Usuwanie danych</b>
    <div class="stack" style="margin-top:10px"><button class="btn" data-act="anon">Anonimizuj historię (usuń ${named} pseudonimów)</button>
    <button class="btn" data-act="old">Usuń gry starsze niż 90 dni</button>
    <button class="btn danger" data-act="wipe">${ICON.trash} Usuń wszystkie dane z urządzenia</button></div>
    <p class="small muted" style="margin-bottom:0">Przed usunięciem warto zrobić kopię zapasową. Każda operacja wymaga potwierdzenia.</p></div>`;
  const re = () => SUB.privacy(el);
  App.bind(el, {
    pin: () => App.sheet("Ustaw PIN", `<label class="f">Nowy PIN (4–8 cyfr)<input class="inp mono" id="p1" inputmode="numeric" type="password" maxlength="8"></label><label class="f" style="margin-top:10px">Powtórz PIN<input class="inp mono" id="p2" inputmode="numeric" type="password" maxlength="8"></label><button class="btn dark full" style="margin-top:12px" data-act="ok">Zapisz PIN</button>`, {
      ok: () => { const a = $("#p1").value, b = $("#p2").value; if (!/^\d{4,8}$/.test(a)) return App.toast("PIN musi mieć 4–8 cyfr"); if (a !== b) return App.toast("PIN-y się różnią"); S.settings.pin = E.hash("pin:" + a); App.unlocked = true; App.save("settings"); App.closeSheet(); App.toast("PIN ustawiony"); re(); }
    }),
    nopin: () => App.confirm("Wyłączyć PIN?", "Panel prowadzącego będzie dostępny bez hasła.", "Wyłącz", () => { S.settings.pin = null; App.save("settings"); re(); }, true),
    clog: () => App.offerText("rejestr-zgod.csv", "﻿" + E.toCSV(S.history.map((h) => Object.assign({}, h, { d: new Date(h.date).toLocaleString("pl-PL") })), [{ label: "Nr", key: "no" }, { label: "Data", key: "d" }, { label: "Pseudonim", key: "player" }, { label: "Tryb", key: "modeName" }, { label: "Zgoda", key: "consent" }, { label: "Notatka", key: "note" }]), "text/csv;charset=utf-8"),
    anon: () => App.confirm("Anonimizować historię?", "Pseudonimy znikną z historii, rankingu i voucherów. Wyniki i statystyki zostaną.", "Anonimizuj", () => { S.history.forEach((h) => { h.player = ""; }); S.vouchers.forEach((v) => { v.player = ""; }); App.save("history", "vouchers"); App.toast("Zanonimizowano"); re(); }, true),
    old: () => { const cut = Date.now() - 90 * DAY; const n = S.history.filter((h) => h.date < cut).length; if (!n) return App.toast("Brak gier starszych niż 90 dni"); App.confirm(`Usunąć ${n} starych gier?`, "Gry sprzed ponad 90 dni znikną z historii i statystyk. Vouchery zostaną.", "Usuń", () => { S.history = S.history.filter((h) => h.date >= cut); App.save("history"); re(); }, true); },
    wipe: () => App.sheet("Usuń wszystkie dane", `<p class="muted" style="margin-top:0">Zostaną usunięte: historia, vouchery, własne pytania, quizy, zdjęcia, nagrody i ustawienia. Tej operacji nie da się cofnąć. Wpisz <b>USUŃ</b>, aby potwierdzić.</p><input class="inp mono" id="wipeIn" autocomplete="off"><div class="grid2" style="margin-top:10px"><button class="btn" data-act="no">Anuluj</button><button class="btn danger" data-act="yes">Usuń wszystko</button></div>`, {
      no: App.closeSheet,
      yes: async () => { if ($("#wipeIn").value.trim().toUpperCase() !== "USUŃ") return App.toast("Wpisz USUŃ"); await App.DB.clear(); location.reload(); }
    })
  });
};

/* ---------- kopia zapasowa ---------- */
const BACKUP_KEYS = ["settings", "history", "prizes", "vouchers", "custom", "quizzes", "usage", "favs", "excluded", "photos", "clips", "rules", "ladder", "wheels", "seq"];
SUB.backup = function (el) {
  const size = (k) => { try { return JSON.stringify(S[k]).length; } catch (e) { return 0; } };
  const total = BACKUP_KEYS.reduce((a, k) => a + size(k), 0);
  el.innerHTML = `<div class="card"><b>Eksport</b><p class="small muted">Jeden plik JSON ze wszystkimi danymi (${(total / 1024).toFixed(0)} KB${S.photos.length ? `, w tym ${S.photos.length} zdjęć` : ""}). Zrób kopię przed zmianą telefonu lub czyszczeniem przeglądarki.</p>
    <div class="grid2"><button class="btn dark" data-act="all">${ICON.download} Pełna kopia</button><button class="btn" data-act="nophoto">Bez zdjęć</button></div></div>
  <div class="card" style="margin-top:12px"><b>Przywracanie</b><p class="small muted">Wybierz plik kopii albo wklej jego treść. Możesz dołączyć dane do obecnych albo zastąpić wszystko.</p>
    <label class="btn full">${ICON.upload} Wybierz plik kopii<input type="file" accept=".json,application/json" data-act="file" hidden></label>
    <textarea class="inp mono" id="bkT" style="min-height:100px;font-size:12px;margin-top:10px" placeholder="…lub wklej JSON"></textarea>
    <div class="grid2" style="margin-top:10px"><button class="btn" data-act="merge">Dołącz do obecnych</button><button class="btn danger" data-act="replace">Zastąp wszystko</button></div></div>
  <p class="small muted">Dane są w pamięci tej przeglądarki. iOS potrafi usunąć dane stron nieużywanych przez kilka tygodni — aplikacja zainstalowana na ekranie początkowym jest bezpieczniejsza, ale kopia zapasowa i tak jest wskazana.</p>`;
  const dump = (photos) => JSON.stringify({ app: "street-quiz-pro", version: 1, exported: new Date().toISOString(), data: Object.fromEntries(BACKUP_KEYS.filter((k) => photos || k !== "photos").map((k) => [k, S[k]])) });
  const parse = () => { try { const j = JSON.parse($("#bkT").value); if (j.app !== "street-quiz-pro" || !j.data) throw new Error(); return j.data; } catch (e) { App.toast("To nie jest plik kopii Street Quiz Pro"); return null; } };
  const byId = (a, b, key) => { const seen = new Set(a.map((x) => x[key])); return a.concat((b || []).filter((x) => !seen.has(x[key]))); };
  App.bind(el, {
    all: () => App.offerText(`street-quiz-kopia-${new Date().toISOString().slice(0, 10)}.json`, dump(true), "application/json"),
    nophoto: () => App.offerText(`street-quiz-kopia-${new Date().toISOString().slice(0, 10)}.json`, dump(false), "application/json"),
    file: async (i) => { const f = i.files[0]; if (f) $("#bkT").value = await readFile(f); },
    merge: () => { const d = parse(); if (!d) return; App.confirm("Dołączyć dane z kopii?", "Gry, vouchery, własne pytania, quizy i zdjęcia z kopii zostaną dodane. Istniejące dane zostają bez zmian.", "Dołącz", async () => {
      S.history = byId(S.history, d.history, "id").sort((a, b) => b.date - a.date); S.vouchers = byId(S.vouchers, d.vouchers, "code"); S.custom = byId(S.custom, d.custom, "id");
      S.quizzes = byId(S.quizzes, d.quizzes, "id"); S.photos = byId(S.photos, d.photos, "id"); S.prizes = byId(S.prizes, d.prizes, "id"); S.clips = (S.clips || []).concat(d.clips || []);
      S.favs = [...new Set(S.favs.concat(d.favs || []))]; S.excluded = [...new Set(S.excluded.concat(d.excluded || []))]; S.seq = Math.max(S.seq || 0, d.seq || 0);
      await App.save(); App.refreshQuestions(); App.toast("Dołączono dane z kopii"); SUB.backup(el); }); },
    replace: () => { const d = parse(); if (!d) return; App.confirm("Zastąpić wszystkie dane?", "Obecna historia, vouchery, pytania i ustawienia zostaną zastąpione zawartością kopii. Jeśli nie masz kopii obecnych danych, najpierw ją zrób.", "Zastąp", async () => {
      BACKUP_KEYS.forEach((k) => { if (d[k] !== undefined) S[k] = d[k]; }); await App.save(); location.reload(); }, true); }
  });
};

/* ---------- instalacja ---------- */
SUB.install = function (el) {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  el.innerHTML = `${standalone ? `<div class="card" style="border-color:var(--ok)"><b>${ICON.check} Aplikacja jest zainstalowana</b><p class="small muted" style="margin-bottom:0">Działa offline — po pierwszym uruchomieniu nie potrzebuje internetu.</p></div>` : ""}
  ${App.installEvt && !standalone ? `<button class="btn primary xl full" data-act="inst">${ICON.download} Zainstaluj aplikację</button>` : ""}
  <div class="card" style="margin-top:12px"><b>Android (Chrome)</b><ol class="small" style="padding-left:18px;margin-bottom:0"><li>Otwórz adres aplikacji w Chrome.</li><li>Stuknij menu ⋮ → <b>Zainstaluj aplikację</b> (lub „Dodaj do ekranu głównego”).</li><li>Ikona pojawi się na pulpicie; aplikacja otwiera się na pełnym ekranie i działa offline.</li></ol></div>
  <div class="card" style="margin-top:12px${ios ? ";border-color:var(--accent)" : ""}"><b>iPhone / iPad (Safari)</b><ol class="small" style="padding-left:18px;margin-bottom:0"><li>Otwórz adres aplikacji w <b>Safari</b> (nie w Chrome ani w Instagramie).</li><li>Stuknij <b>Udostępnij</b> (kwadrat ze strzałką) → <b>Do ekranu początkowego</b>.</li><li>Uruchamiaj z ikony na ekranie — wtedy działa offline i bez paska przeglądarki.</li></ol></div>
  <div class="card" style="margin-top:12px"><b>Skąd adres aplikacji?</b><p class="small muted" style="margin-bottom:0">Instalacja PWA wymaga adresu HTTPS. Najprościej: wrzuć folder aplikacji (z pliku ZIP) na Netlify Drop (app.netlify.com/drop), GitHub Pages albo Cloudflare Pages — dostaniesz link do otwarcia na telefonie. Podgląd w czacie nie instaluje aplikacji.</p></div>
  <div class="card" style="margin-top:12px"><b>Dobre praktyki na ulicy</b><ul class="small" style="padding-left:18px;margin-bottom:0"><li>Ustaw jasny motyw w pełnym słońcu i maksymalną jasność ekranu.</li><li>Włącz tryb samolotowy, jeśli nie chcesz powiadomień w nagraniu — aplikacja działa bez sieci.</li><li>Ustaw PIN, zanim oddasz telefon uczestnikowi.</li><li>Raz w tygodniu zrób kopię zapasową.</li></ul></div>`;
  App.bind(el, { inst: async () => { try { App.installEvt.prompt(); await App.installEvt.userChoice; App.installEvt = null; SUB.install(el); } catch (e) {} } });
};

})();
